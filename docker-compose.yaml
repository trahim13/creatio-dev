services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: postgres17-creatio
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "4000:5432"
    volumes:
      - pg_data_creatio:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U app -d app || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_line_prefix=%m [%p] user=%u db=%d host=%h "
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis7-creatio
    command: [ "redis-server", "--appendonly", "yes" ]
    environment:
      TZ: UTC
    ports:
      - "4001:6379"
    volumes:
      - redis_data_creatio:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  creatio:
    build:
      context: ./creatio
      dockerfile: Dockerfile
    container_name: creatio83
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Development
      COMPlus_ThreadPool_ForceMinWorkerThreads: "100"
    ports:
      - "5000:5000"   # HTTP
      - "5002:5002"   # HTTPS
    volumes:
      - ./creatio/Logs:/app/Logs
      #      включить режим разработки
      - ./creatio/Terrasoft.WebHost.dll.config:/app/Terrasoft.WebHost.dll.config:ro
      # Creatio берёт текущие пакеты (packages), которые сейчас “живут” в базе данных (и/или собраны в приложении), и выгружает их исходники на диск в папку Terrasoft.Configuration
      #    Вся Terrasoft.Configuration\Pkg — можно удалить, но это “жёсткий reset” файловой копии (“удалить рабочую копию”)
      - ./creatio/Terrasoft.Configuration:/app/Terrasoft.Configuration
    restart: unless-stopped

volumes:
  pg_data_creatio:
  redis_data_creatio:
